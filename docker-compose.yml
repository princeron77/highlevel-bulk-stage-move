# One command: `docker compose up --build`
#   postgres -> init (migrate + seed small) -> api (http://localhost:3000/docs) + 2 workers
# Tests:       `docker compose --profile test up --build --exit-code-from test`
x-db-env: &db-env
  DATABASE_URL: postgres://app:app@postgres:5432/opportunities

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: opportunities
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d opportunities"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  init:
    build: { context: ., target: runtime }
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed.js small"]
    environment: *db-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: runtime }
    command: ["node", "dist/src/main.api.js"]
    environment:
      <<: *db-env
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: { context: ., target: runtime }
    command: ["node", "dist/src/main.worker.js"]
    environment:
      <<: *db-env
    depends_on:
      init: { condition: service_completed_successfully }
    # why: two workers show that claiming is safe under concurrency (SKIP LOCKED + fencing).
    deploy:
      replicas: 2
    stop_grace_period: 15s
    restart: unless-stopped

  # Runs the test suite against the same Postgres (each test file creates its own database).
  test:
    profiles: ["test"]
    build: { context: ., target: build }
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: postgres://app:app@postgres:5432/postgres
      NODE_ENV: test
      LOG_LEVEL: silent
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
